name: vig

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10

  # PyTorch + CUDA
  - pytorch=2.2.2
  - torchvision=0.17.2
  - pytorch-cuda=11.8

  # Scientific libraries
  - numpy=1.26.4
  - scipy
  - scikit-learn
  - pandas
  - pillow=10.2.0
  - matplotlib
  - pyyaml

  # Development
  - ipython
  - ipykernel
  - pip

  # FaceNet
  - pip:
      - facenet-pytorch==2.6.0
      - tqdm>=4.66,<5
      - requests>=2.31,<3

